<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malakai for ANUSA 2026</title>
<meta name="description" content="Malakai for ANUSA 2026. Malakai King is your independent candidate for NUS delegate. Voting open 6 – 9 October.">
<meta property="og:title" content="Malakai for ANUSA 2026">
<meta property="og:description" content="Malakai King is your independent candidate for NUS delegate. Voting open 6 – 9 October.">
<meta property="og:image" content="malakai-for-anusa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --rust: #c1432b;
  --forest: #1c2a1e;
  --cream: #f0ead7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 3rem 1.25rem;
  background: var(--cream);
  color: var(--forest);
  font-family: 'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  line-height: 1.55;
}

main {
  max-width: 48rem;
  margin: 0 auto;
}

img {
  display: block;
  width: 11rem;
  max-width: 45%;
  height: auto;
  margin-bottom: 2rem;
}

h1 {
  margin: 0;
  font-size: min(7vw, 3.5rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  white-space: nowrap;
}

.lead {
  margin: 1.5rem 0 0;
  max-width: 34rem;
  font-size: 1.15rem;
  font-weight: 600;
}

.details {
  margin: 2.5rem 0 0;
  padding: 1.5rem 0 0;
  border-top: 3px solid var(--rust);
  font-size: 0.95rem;
}

.details dt {
  font-weight: 700;
  color: var(--rust);
}

.details dd {
  margin: 0 0 0.9rem;
}

.details a {
  color: var(--forest);
  text-decoration-color: var(--rust);
  text-underline-offset: 0.2em;
}

.details a:hover {
  color: var(--rust);
}

a:focus-visible {
  outline: 3px solid var(--rust);
  outline-offset: 3px;
}

@media (min-width: 40em) {
  body {
    padding: 5rem 3rem;
  }

  .details dl {
    display: grid;
    grid-template-columns: 9rem 1fr;
    gap: 0 1.5rem;
  }
}
</style>
</head>
<body>

<main>
  <img src="malakai-for-anusa.png" alt="Malakai for ANUSA" width="440" height="440">

  <h1>Malakai for ANUSA 2026</h1>

  <p class="lead">Malakai King is your independent candidate for NUS delegate. Voting open 6 – 9 October.</p>

  <section class="details">
    <dl>
      <dt>Authorised by</dt>
      <dd>Malakai King</dd>

      <dt>Address</dt>
      <dd>Acton, ACT</dd>

      <dt>Email</dt>
      <dd><a href="mailto:malakai@malakaiking.com">malakai@malakaiking.com</a></dd>

      <dt>LinkedIn</dt>
      <dd><a href="https://www.linkedin.com/in/malakai-king-81ba21276/">Malakai King</a></dd>
    </dl>
  </section>
</main>

</body>
</html>
